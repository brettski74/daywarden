# Household policy. Loaded into the policy service's database each time it starts.
# Restart the decisions service after editing: docker compose restart decisions

[household]
# IANA timezone that decides what "today" and "now" mean for every rule.
# Leave it commented out to use the timezone of the machine running Compose.
# timezone = "America/Toronto"

# Absolute URL substituted for the revision_task token until real tasks exist.
# PLACEHOLDER: replace the host with the machine that will serve revision tasks,
# and put that same host in config/bypass.txt. The two files are edited by hand.
revision_task = "http://192.168.1.10:8080/tasks/next"

# How long a new usage bucket is. The default is five minutes. This is not a quota.
# The length has to divide a 24-hour day (2m, 5m, and 10m do; 7m does not), so
# the buckets meet midnight. A new length takes effect when this file is loaded.
# bucket_length = "5m"

# One [[clients]] table per computer. address is the computer's DHCP reservation,
# written as an IP or as a DNS name. DNS names are looked up when the service
# starts, not on every request, so restart the service if a reservation changes.
# A computer that is not listed here still gets the household rules. Listing it
# gives it a name, and later its own revision tasks and usage.

[[clients]]
name = "Younger child"
address = "192.168.1.40"  # PLACEHOLDER: replace with this computer's reserved IP or DNS name

# The older child is not enrolled yet. To enrol them, uncomment this table, set
# their reserved address, and add their computer to the proxy alias on the firewall.
# [[clients]]
# name = "Older child"
# address = "older-child.lan"

# One [[groups]] table per site group. Every request is put in exactly one group.
# Groups are tried in priority order, lowest number first, and the first group
# with a matching pattern wins. Each priority may be used by one group only.
#
# A pattern containing "://" is matched against the whole URL, without its
# #fragment. Any other pattern is matched against the host name only. Matching
# ignores case. "*" matches anything, including "/". "?" matches one character.
# "*.youtube.com" matches www.youtube.com but not youtube.com itself.
#
# One group may say default = true. It is used for any site that no other group
# matches, whatever its priority, and its patterns are ignored. With no default
# group, a site outside every group is denied.
#
# Each group has an ordered list of rules, written as [[groups.rules]] under
# that group. A rule has a condition and two actions, when_true and when_false.
# An action is continue, deny with a message, redirect to an absolute URL or
# to the revision_task token, or allow. The first action other than continue
# is the decision. A group with no rules denies the request.
#
# A time_window is true when the household-local time is inside any of its
# windows. The start is included and the end is excluded, so 15:00 belongs to
# the later of two windows that meet there. A window may name weekdays, or
# apply every day when days is left out. A window may cross midnight.
#
# tasks_complete carries a required count. It is true when this client has at
# least that many revision successes stored for the household-local date. A
# [[groups.rules.weekdays]] table can set a different count for one weekday.
# Nothing records a real completion yet, so the count stays zero unless it is
# written into the database.
#
# quota_remaining is true when today's ended usage for this client and this
# group is strictly under the group's quota. quota is a duration such as 2h,
# 120m, or 7200s. A bare number is rejected. Leave quota off and the condition
# stays true. Buckets are household.bucket_length (five minutes by default),
# aligned to local midnight. A bucket counts only after it ends, at the length
# stored for that bucket. Forwarded traffic marks the bucket that contains the
# report. A URL in no group is ignored.

# School work is allowed at any time and has no quota. The patterns are a
# starter for Google Classroom and the Google hosts a Classroom session
# actually loads: the app, sign-in, Docs, Drive, Sheets, Slides, Forms, and
# the static and image hosts those pages request. This is not a promise that
# every school site is covered, and it is not all of Google. A YouTube video
# embedded in a Classroom page stays in Entertainment. When you add a host
# here, add the same glob to config/bypass.txt so the page still loads when
# the policy service is down.

[[groups]]
name = "School work"
priority = 10
patterns = [
    "classroom.google.com",
    "docs.google.com",
    "*.docs.google.com",
    "drive.google.com",
    "*.drive.google.com",
    "sheets.google.com",
    "slides.google.com",
    "forms.google.com",
    "accounts.google.com",
    "apis.google.com",
    "classroom.googleapis.com",
    "www.googleapis.com",
    "oauth2.googleapis.com",
    "*.gstatic.com",
    "*.googleusercontent.com",
    "*.usercontent.google.com",
    "lh?.google.com",
    "clients?.google.com",
]

[[groups.rules]]
condition = "always"
when_true = { action = "allow" }
when_false = { action = "continue" }

# Entertainment is the Monday-to-Thursday schedule: bedtime denies, school
# hours redirect to revision, and the evening continues only after today's
# revision count reaches 2. The quota is two hours, written as a duration.
# "*.youtube.com" does not match youtube.com itself, so the bare name is
# listed too.
#
# Friday, Saturday, and Sunday below are a starting suggestion. The problem
# statement does not set these hours. They use the same three rules, with a
# later morning and a wider evening (12:00–21:00 instead of 15:00–19:00).
# Edit the windows; do not add a second copy of the rules.

[[groups]]
name = "Entertainment"
priority = 30
quota = "2h"
patterns = [
    "*.youtube.com",
    "youtube.com",
    "youtu.be",
    "*.youtube-nocookie.com",
    "*.googlevideo.com",
    "*.ytimg.com",
    "youtubei.googleapis.com",
]

[[groups.rules]]
condition = "time_window"
when_true = { action = "deny", message = "It's bedtime." }
when_false = { action = "continue" }

[[groups.rules.windows]]
start = "00:00"
end = "07:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: weekend bedtime runs an hour later.
[[groups.rules.windows]]
start = "00:00"
end = "08:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "time_window"
when_true = { action = "redirect", location = "revision_task" }
when_false = { action = "continue" }

[[groups.rules.windows]]
start = "07:00"
end = "15:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: a short weekend revision block, then the evening opens.
[[groups.rules.windows]]
start = "08:00"
end = "12:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "time_window"
when_true = { action = "continue" }
when_false = { action = "deny", message = "YouTube is closed for today." }

[[groups.rules.windows]]
start = "15:00"
end = "19:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: wider evening, noon until 21:00.
[[groups.rules.windows]]
start = "12:00"
end = "21:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "tasks_complete"
required = 2
when_true = { action = "continue" }
when_false = { action = "redirect", location = "revision_task" }

[[groups.rules]]
condition = "quota_remaining"
when_true = { action = "allow" }
when_false = { action = "deny", message = "Time is up for today." }

# The rest of the internet. Same hours as Entertainment, including the
# weekend suggestion, and the same daily revision requirement of 2. No quota:
# once revision is done inside the open window, the request is allowed.
# Anything that matches no earlier group lands here.

[[groups]]
name = "Everything else"
priority = 1000
default = true

[[groups.rules]]
condition = "time_window"
when_true = { action = "deny", message = "It's bedtime." }
when_false = { action = "continue" }

[[groups.rules.windows]]
start = "00:00"
end = "07:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: same later weekend bedtime as Entertainment.
[[groups.rules.windows]]
start = "00:00"
end = "08:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "time_window"
when_true = { action = "redirect", location = "revision_task" }
when_false = { action = "continue" }

[[groups.rules.windows]]
start = "07:00"
end = "15:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: same short weekend revision block as Entertainment.
[[groups.rules.windows]]
start = "08:00"
end = "12:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "time_window"
when_true = { action = "continue" }
when_false = { action = "deny", message = "The internet is closed for today." }

[[groups.rules.windows]]
start = "15:00"
end = "19:00"
days = ["monday", "tuesday", "wednesday", "thursday"]

# Starting suggestion: same wider weekend evening as Entertainment.
[[groups.rules.windows]]
start = "12:00"
end = "21:00"
days = ["friday", "saturday", "sunday"]

[[groups.rules]]
condition = "tasks_complete"
required = 2
when_true = { action = "continue" }
when_false = { action = "redirect", location = "revision_task" }

[[groups.rules]]
condition = "always"
when_true = { action = "allow" }
when_false = { action = "continue" }

tasks:
  parts_of_speech:
    Parts of Speech:
      group: younger
      pass_cooldown: 1
      body:
        sentences:
          - sentence: The quick, brown fox jumps over the lazy dog.
            parts:
              noun: [fox, dog]
              verb: [jumps]
              adjective: [quick, brown, lazy]
          - sentence: "Dry the dishes with a dry towel."
            parts:
              noun: ["dishes", "towel"]
              verb: ["dry"]
              adjective: ["dry[2]"]
          - sentence: "The cat sat on the mat."
            parts:
              noun: ["cat", "mat"]
              verb: ["sat"]
              adjective: []
          - sentence: The sentence must contain some words.
            parts:
              noun: [sentence, words]
              verb: [contain]
              adjective: [some]

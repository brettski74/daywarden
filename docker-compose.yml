# Start with: docker compose up
# The listen port and the CA directory are set in .env.

name: smartproxy

services:
  proxy:
    image: mitmproxy/mitmproxy:12.2.3
    entrypoint:
      - /bin/bash
      - /usr/local/bin/smartproxy-entrypoint.sh
    command:
      - mitmdump
      - --mode
      - regular
      - --listen-host
      - 0.0.0.0
      # 8080 is the port inside the container. Clients use PROXY_PORT.
      - --listen-port
      - "8080"
    ports:
      - "${PROXY_PORT}:8080"
    volumes:
      - "${CA_VOLUME_PATH}:/home/mitmproxy/.mitmproxy"
      - ./proxy/entrypoint.sh:/usr/local/bin/smartproxy-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import socket; s = socket.create_connection(("127.0.0.1", 8080), 2); s.close()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

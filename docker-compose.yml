# Start with: make up
# The ports and the CA directory are set in .env. dw works out PROXY_PORT,
# POLICY_PORT, and PROXY_CONFIG_PORT from PORT_BASE, because Compose cannot
# add numbers. The defaults here are the ports for PORT_BASE 8080, so a bare
# docker compose up publishes the same ports as dw up with the defaults.
# Hosts that skip authorization are listed in config/bypass.txt, and the
# proxy adds the policy server's names from PARENT_NAMES.
# The decisions service is the policy service. The household policy is
# config/policy.yaml. Client groups, site groups, and rule sets are loaded
# from that file each time the service starts, and again on dw reload,
# which restarts no container. POLICY_FILE must name a
# .yaml or .yml file. An address or a URL in no configured group is the
# implicit group default.
# The observations service writes POST /v1/observations into the usage ledger
# in the policy-data volume. Each report is filed under the classified client
# group and site group, and under each quota that accepts it. The proxy
# keeps forwarding if that service is down. When a report shows
# that this flow's recorded allow has reached a clock deadline or a volume
# ceiling, and the access rules no longer allow it, the service answers
# with a cut and the proxy stops that transfer. Any other answer leaves it
# running.
# POLICY_PORT publishes the policy pages over HTTPS: the usage report, the
# attempt review, and the task pages. Accounts are added with
# `python -m policy.accounts` inside the decisions container. The decision
# API stays on plain HTTP inside the compose network. It does not show the
# report and does not edit policy.
# The autoconfig service serves the proxy auto-config file browsers fetch,
# http://<this machine>:PROXY_CONFIG_PORT/proxy.pac, also as /wpad.dat.

name: daywarden

services:
  decisions:
    build: ./policy
    image: daywarden-policy:local
    pull_policy: build
    environment:
      POLICY_FILE: ${POLICY_FILE:-/etc/daywarden/policy.yaml}
      POLICY_DB: /var/lib/daywarden/policy.sqlite3
      MACHINE_LOCALTIME: /etc/host-localtime
      MACHINE_HOSTNAME: /etc/host-hostname
      CA_DIR: /var/lib/daywarden/ca
      PARENT_NAMES: ${PARENT_NAMES}
      PARENT_IDLE: ${PARENT_IDLE:-15m}
      PARENT_LIFETIME: ${PARENT_LIFETIME:-180m}
      PARENT_HTTPS_PORT: "8443"
      # Host port clients use. Task URLs use this, not the bind port 8443.
      POLICY_PORT: ${POLICY_PORT:-8084}
      # For the configuration URL in the policy summary.
      PROXY_CONFIG_PORT: ${PROXY_CONFIG_PORT:-8088}
      DAYWARDEN_DATA_DIR: /var/lib/daywarden/data
    ports:
      # Clients open https://<this machine>:POLICY_PORT/usage. 8090 inside
      # the container stays plain HTTP for the proxy and the health check.
      # 8443 is where the HTTPS listener is bound.
      - "${POLICY_PORT:-8084}:8443"
    volumes:
      - ${DAYWARDEN_CONFIG_DIR:-./config}:/etc/daywarden:ro
      - policy-data:/var/lib/daywarden
      - ${CA_VOLUME_PATH}:/var/lib/daywarden/ca
      # Used for the household timezone when policy.yaml does not set one.
      - /etc/localtime:/etc/host-localtime:ro
      # Used for task URLs when policy.yaml does not set hostname. The
      # container's own hostname is not a name clients can open.
      - /etc/hostname:/etc/host-hostname:ro
      # Parent-managed task files, such as spelling recordings under
      # spelling/current and spelling/revision. Read on each new quiz run.
      # make up creates the directory. Docker would create it owned by root.
      # It sits under the writable policy-data mount: a read-only parent
      # mount would stop Docker creating the nested mount point.
      - type: bind
        source: ${DAYWARDEN_DATA_DIR:-${HOME}/daywarden}
        target: /var/lib/daywarden/data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8090/health", timeout=2).read()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  observations:
    build: ./policy
    image: daywarden-policy:local
    pull_policy: build
    command:
      - python
      - -m
      - policy.observations
    environment:
      POLICY_FILE: ${POLICY_FILE:-/etc/daywarden/policy.yaml}
      POLICY_DB: /var/lib/daywarden/policy.sqlite3
      OBSERVATION_LOG: /tmp/observations.jsonl
      OBSERVATION_PORT: "8091"
      MACHINE_LOCALTIME: /etc/host-localtime
    volumes:
      - ${DAYWARDEN_CONFIG_DIR:-./config}:/etc/daywarden:ro
      - policy-data:/var/lib/daywarden
      # Used when policy.yaml does not set a timezone, so a report lands on
      # the same local day the decisions service uses.
      - /etc/localtime:/etc/host-localtime:ro
    depends_on:
      decisions:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8091/health", timeout=2).read()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  proxy:
    image: mitmproxy/mitmproxy:12.2.3
    entrypoint:
      - /bin/bash
      - /opt/daywarden/entrypoint.sh
    command:
      - mitmdump
      - --mode
      - regular
      - --listen-host
      - 0.0.0.0
      # 8080 is the port inside the container. Clients use PROXY_PORT.
      - --listen-port
      - "8080"
      # lazy waits until the addon allows the request before dialing upstream.
      - --set
      - connection_strategy=lazy
      - --scripts
      - /opt/daywarden/addon.py
    environment:
      DECISION_URL: http://decisions:8090/v1/decisions
      OBSERVATION_URL: http://observations:8091/v1/observations
      OBSERVATION_INTERVAL: ${OBSERVATION_INTERVAL:-60}
      OBSERVATION_TIMEOUT: ${OBSERVATION_TIMEOUT:-2}
      BYPASS_PATH: /etc/daywarden/bypass.txt
      # The policy server's names are forwarded without a decision, the same
      # as a host in bypass.txt, and carry the child's address.
      PARENT_NAMES: ${PARENT_NAMES}
      DECISION_TIMEOUT: "2"
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - "${CA_VOLUME_PATH}:/home/mitmproxy/.mitmproxy"
      - ./proxy:/opt/daywarden:ro
      - ${DAYWARDEN_CONFIG_DIR:-./config}:/etc/daywarden:ro
    depends_on:
      decisions:
        condition: service_healthy
      observations:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import socket; s = socket.create_connection(("127.0.0.1", 8080), 2); s.close()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  autoconfig:
    build: ./policy
    image: daywarden-policy:local
    pull_policy: build
    command:
      - python
      - -m
      - policy.autoconfig
    # The host's network, so the file is built from the server's own
    # interfaces and addresses, and PROXY_CONFIG_PORT is bound directly.
    network_mode: host
    # It writes nothing and binds a port above 1024. As nobody, it cannot
    # read anything under the host's /etc that only root can.
    user: "65534:65534"
    environment:
      POLICY_FILE: ${POLICY_FILE:-/etc/daywarden/policy.yaml}
      PROXY_CONFIG_PORT: ${PROXY_CONFIG_PORT:-8088}
      # The proxy port the file names.
      PROXY_PORT: ${PROXY_PORT:-8080}
      # The policy server's names, which the file sends direct.
      PARENT_NAMES: ${PARENT_NAMES}
      MACHINE_HOSTNAME: /etc/host-hostname
      RESOLV_CONF: /etc/host-resolver/${RESOLV_CONF_NAME:-resolv.conf}
    volumes:
      - ${DAYWARDEN_CONFIG_DIR:-./config}:/etc/daywarden:ro
      - /etc/hostname:/etc/host-hostname:ro
      # The directory that holds the host's resolv.conf, read on every fetch
      # for the search domains. NetworkManager and systemd-resolved replace
      # the file, which a single-file mount would not see. dw follows a
      # resolv.conf symlink, such as into /run/systemd/resolve.
      - type: bind
        source: ${RESOLV_CONF_DIR:-/etc}
        target: /etc/host-resolver
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import os, urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:" + os.environ["PROXY_CONFIG_PORT"] + "/proxy.pac", method="HEAD"), timeout=2)'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

volumes:
  policy-data:

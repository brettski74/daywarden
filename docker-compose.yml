# Start with: make up
# The listen port and the CA directory are set in .env.
# Hosts that skip authorization are listed in config/bypass.txt.
# The decisions service is the policy service. Clients, the household
# timezone, site groups, and rules are in config/policy.toml and are kept in
# the policy-data volume. A group with no rules denies the request.
# DECISION_FILE is read only when DECISION_STUB=1, which the addon tests set.
# The observations service records POST /v1/observations until the ledger exists.
# The proxy still forwards if that service is down.

name: smartproxy

services:
  decisions:
    build: ./policy
    image: smartproxy-policy:local
    pull_policy: build
    environment:
      DECISION_FILE: /etc/smartproxy/decision.json
      POLICY_FILE: /etc/smartproxy/policy.toml
      POLICY_DB: /var/lib/smartproxy/policy.sqlite3
      MACHINE_LOCALTIME: /etc/host-localtime
    volumes:
      - ${SMARTPROXY_CONFIG_DIR:-./config}:/etc/smartproxy:ro
      - policy-data:/var/lib/smartproxy
      # Used for the household timezone when policy.toml does not set one.
      - /etc/localtime:/etc/host-localtime:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8090/health", timeout=2).read()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  observations:
    image: mitmproxy/mitmproxy:12.2.3
    entrypoint:
      - python3
      - /opt/smartproxy/stub.py
    environment:
      OBSERVATION_LOG: /tmp/observations.jsonl
      STUB_PORT: "8091"
    volumes:
      - ./observations/stub.py:/opt/smartproxy/stub.py:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8091/health", timeout=2).read()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  proxy:
    image: mitmproxy/mitmproxy:12.2.3
    entrypoint:
      - /bin/bash
      - /opt/smartproxy/entrypoint.sh
    command:
      - mitmdump
      - --mode
      - regular
      - --listen-host
      - 0.0.0.0
      # 8080 is the port inside the container. Clients use PROXY_PORT.
      - --listen-port
      - "8080"
      # lazy waits until the addon allows the request before dialing upstream.
      - --set
      - connection_strategy=lazy
      - --scripts
      - /opt/smartproxy/addon.py
    environment:
      DECISION_URL: http://decisions:8090/v1/decisions
      OBSERVATION_URL: http://observations:8091/v1/observations
      OBSERVATION_INTERVAL: ${OBSERVATION_INTERVAL:-60}
      OBSERVATION_TIMEOUT: ${OBSERVATION_TIMEOUT:-2}
      BYPASS_PATH: /etc/smartproxy/bypass.txt
      DECISION_TIMEOUT: "2"
    ports:
      - "${PROXY_PORT}:8080"
    volumes:
      - "${CA_VOLUME_PATH}:/home/mitmproxy/.mitmproxy"
      - ./proxy:/opt/smartproxy:ro
      - ${SMARTPROXY_CONFIG_DIR:-./config}:/etc/smartproxy:ro
    depends_on:
      decisions:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import socket; s = socket.create_connection(("127.0.0.1", 8080), 2); s.close()'
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  policy-data:
